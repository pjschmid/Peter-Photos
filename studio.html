!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Studio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Studio</h1>

<section class="section-intro">
  <h2>
    ... playing with light and flash 
  </h2>
</section>

<nav class="main-nav">
  <a href="index.html" class="nav-home">Home</a>
  <a href="gallery.html" class="nav-gallery">Galleries</a>
  <a href="collections.html" class="nav-collection">Collections</a>
  <span class="nav-break" aria-hidden="true"></span>
  <a href="highlowkey.html">High-key/low-key</a>
  <a href="highspeed.html">High-speed</a>
  <a href="studio.html" class="active">Studio</a>
</nav>

<div class="gallery">

  <div class="gallery-item">
    <img
      class="thumb"
      src="images/collections/highspeed/thumbs/SingleDrop-thumb.jpg"
      data-file="images/collections/highspeed/SingleDrop.jpg"
      onclick="openLightbox(this)"
      data-camera="Nikon Z8"
      data-lens="Laowa 100mm f/2.8 2x Ultra Macro APO"
      data-focal="100mm"
      data-aperture="22"
      data-iso="400"
      data-shutter="(Bulk)"
      data-note="flash frozen"
      >
    <span class="caption">
      <span style="color: #fff; font-size: 1rem;">Single drop</span>
      <span style="color: #8f8; font-size: 0.6rem;"> (high-speed)</span>
    </span>
  </div>

</div>

<div id="lightbox">
  <div class="lightbox-content">
    <div id="lightbox-media"></div>
    <div id="lightbox-caption"></div>
    <div id="lightbox-meta"></div>
  </div>
</div>

<script src="js/lightbox.js"></script>
</body>
</html>
